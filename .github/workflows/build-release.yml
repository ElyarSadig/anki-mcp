name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match version.txt (v$version)." >&2
            exit 1
          fi
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Validate configuration examples
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          for path in pathlib.Path("examples").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in pathlib.Path("examples").glob("*.toml"):
              tomllib.loads(path.read_text(encoding="utf-8"))
          PY
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        run: |
          mkdir -p build
          filename="anki-mcp-$GOOS-$GOARCH"
          if [[ "$GOOS" == windows ]]; then
            filename="$filename.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "build/$filename" .
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: anki-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/anki-mcp-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: anki-mcp-*
          merge-multiple: true
          path: artifacts
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum anki-mcp-* > SHA256SUMS
      - name: Create release and upload binaries
        working-directory: artifacts
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" anki-mcp-* SHA256SUMS --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" anki-mcp-* SHA256SUMS \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
